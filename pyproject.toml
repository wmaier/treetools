[build-system]
# PEP 639 support for license/license-files landed in setuptools 77.0.3+
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treetools"
version = "1.0.2"
description = "Tools for processing treebank trees"
readme = "README.md"
authors = [{ name = "Wolfgang Maier", email = "maierw@hhu.de" }]

license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

requires-python = ">=3.11"  
keywords = ["treebanks", "trees", "grammar"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic"
]

[project.urls]
Homepage = "https://github.com/wmaier/treetools"
Repository = "https://github.com/wmaier/treetools"
Issues = "https://github.com/wmaier/treetools/issues"
Download = "https://github.com/wmaier/treetools/archive/v1.0.0.tar.gz"
Changelog = "https://github.com/wmaier/treetools/releases"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=7",
  "pytest-cov>=4",
]

[project.scripts]
treetools-cli = "treetools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["treetools"]

[dependency-groups]
dev = [
    "build>=1.4.2",
    "mypy>=1.15",
    "twine>=6.2.0",
]

[tool.mypy]
# Typing is introduced in stages.  The legacy CLI and format-specific helper
# modules remain permissive while the core tree data model is checked on every
# development run.
python_version = "3.11"
files = [
    "treetools/types.py",
    "treetools/trees.py",
]
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
